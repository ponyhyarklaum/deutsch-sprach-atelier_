name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar minificador (terser)
        run: npm install --prefix tools --no-audit --no-fund
      - name: Compilar HTML y SCORM
        run: python tools/build.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: deutsch-atelier
          path: dist/*.*
      - name: Publicar release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deutsch-atelier.html
            dist/deutsch-atelier-scorm12.zip
